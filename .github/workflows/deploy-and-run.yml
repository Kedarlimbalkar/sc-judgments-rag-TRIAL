name: Deploy and Run SC Judgments RAG Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/315039048199/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@sc-judgments-rag.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and Push Docker Container
        run: |
          docker build -t asia-south1-docker.pkg.dev/sc-judgments-rag/rag-repo/offline-pipeline:latest .
          docker push asia-south1-docker.pkg.dev/sc-judgments-rag/rag-repo/offline-pipeline:latest

      - name: Create or Update Cloud Run Job
        run: |
          gcloud run jobs describe sc-rag-offline-job --region=asia-south1 > /dev/null 2>&1 && \
          gcloud run jobs update sc-rag-offline-job \
            --image=asia-south1-docker.pkg.dev/sc-judgments-rag/rag-repo/offline-pipeline:latest \
            --region=asia-south1 \
            --project=sc-judgments-rag \
            --command="python" \
            --args="offline_pipeline.py,--limit,22" \
            --set-cloudsql-instances=sc-judgments-rag:asia-south1:sc-rag-db \
            --set-env-vars=GCP_PROJECT=sc-judgments-rag,GCP_REGION=asia-south1,BUCKET_NAME=sc-judgments-rag-sc-rag,CLOUD_SQL_CONNECTION_NAME=sc-judgments-rag:asia-south1:sc-rag-db \
            --memory=4Gi \
            --cpu=2 \
            --task-timeout=900s \
            --max-retries=0 || \
          gcloud run jobs create sc-rag-offline-job \
            --image=asia-south1-docker.pkg.dev/sc-judgments-rag/rag-repo/offline-pipeline:latest \
            --region=asia-south1 \
            --project=sc-judgments-rag \
            --command="python" \
            --args="offline_pipeline.py,--limit,22" \
            --set-cloudsql-instances=sc-judgments-rag:asia-south1:sc-rag-db \
            --set-env-vars=GCP_PROJECT=sc-judgments-rag,GCP_REGION=asia-south1,BUCKET_NAME=sc-judgments-rag-sc-rag,CLOUD_SQL_CONNECTION_NAME=sc-judgments-rag:asia-south1:sc-rag-db \
            --memory=4Gi \
            --cpu=2 \
            --task-timeout=900s \
            --max-retries=0

      - name: Execute Cloud Run Job
        run: |
          echo "Executing Cloud Run batch job (timeout 15m, 0 retries)..."
          gcloud run jobs execute sc-rag-offline-job --region=asia-south1 --wait

      - name: Deploy Production Chatbot Web Service
        run: |
          echo "Deploying production Supreme Court RAG Chatbot Service..."
          gcloud run deploy sc-rag-chatbot \
            --image=asia-south1-docker.pkg.dev/sc-judgments-rag/rag-repo/offline-pipeline:latest \
            --region=asia-south1 \
            --project=sc-judgments-rag \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --set-cloudsql-instances=sc-judgments-rag:asia-south1:sc-rag-db \
            --set-env-vars=GCP_PROJECT=sc-judgments-rag,GCP_REGION=asia-south1,BUCKET_NAME=sc-judgments-rag-sc-rag,CLOUD_SQL_CONNECTION_NAME=sc-judgments-rag:asia-south1:sc-rag-db \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5

      - name: Output Live Production URL
        run: |
          PROD_URL=$(gcloud run services describe sc-rag-chatbot --region=asia-south1 --format='value(status.url)')
          echo "=========================================================="
          echo "🚀 PRODUCTION CHATBOT LIVE AT: $PROD_URL"
          echo "📚 Interactive API Docs at: $PROD_URL/docs"
          echo "=========================================================="
          echo "## ⚖️ Production Supreme Court RAG Chatbot" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Chatbot UI**: [$PROD_URL]($PROD_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Interactive API Docs**: [$PROD_URL/docs]($PROD_URL/docs)" >> $GITHUB_STEP_SUMMARY
